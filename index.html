<body><div class="viewerbar"><span class="viewerbrand">PMPN / 完整前端原型</span><button class="btn secondary" data-action="shell-catalog" aria-label="打开完整页面索引">☷ 页面索引</button><span id="route-label"></span><span class="spacer"></span><span class="viewer-note">示例数据 · 本地演示</span><select id="scenario-select" aria-label="交互状态"><option value="normal">正常状态</option><option value="loading">加载中</option><option value="empty">空状态</option><option value="error">读取失败</option><option value="unknown">结果 / 金额未知</option><option value="logged-out">未登录</option><option value="no-permission">无权限</option></select><select id="role-select" class="role-control" aria-label="账户角色"><option value="user">普通用户</option><option value="auditor">审计员</option><option value="admin" selected>管理员</option></select><button class="btn secondary device-control" data-action="shell-device">手机视图</button><button class="btn secondary" data-action="shell-reset" title="重置所有演示数据">重置</button></div><div class="device" id="device"></div><div id="catalog-root" hidden></div><div id="overlay-root"></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div><script>(() => {
  'use strict';
  const icons={wallet:'<path d="M20 8V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v11H5a3 3 0 0 1-3-3V6"/><path d="M20 12h-5v5h5"/>',plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',chevron:'<path d="m6 9 6 6 6-6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 8a7 7 0 0 1 11.7-2L20 9M4 15l2.8 3A7 7 0 0 0 18.5 16"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',external:'<path d="M15 3h6v6m0-6L10 14M10 3H3v18h18v-7"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3v.1"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-16a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v2"/>',chart:'<path d="M4 3v17h17M7 15l4-5 4 2 6-7"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-5 5 5-5 5 5M4 16v5h16v-5"/>',logout:'<path d="M9 3H3v18h6m0-9h12m-5-5 5 5-5 5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/>',file:'<path d="M14 2H4v20h16V8l-6-6Zm0 0v6h6M8 12h8M8 16h8"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 3c-1 .5-1 1-1 2m0 3v.1"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',folder:'<path d="M3 7V4h6l3 3h9v13H3V7Z"/>',edit:'<path d="m16 3 5 5-12 12H4v-5L16 3Z"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7l0-8Z"/>',play:'<path d="m7 4 14 8-14 8V4Z"/>',pause:'<path d="M7 4v16m10-16v16"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/>',filter:'<path d="M3 4h18l-7 8v7l-4 2v-9L3 4Z"/>'};
  const P=window.P={state:{route:'follow',scenario:'normal',role:'admin',walletId:1,loggedIn:true},routes:{},handlers:{},wallets:[{id:1,label:'主钱包',address:'0x1111111111111111111111111111111111111111',cash:248.60,isDefault:true,status:'ready'},{id:2,label:'短线钱包',address:'0x2222222222222222222222222222222222222222',cash:83.40,isDefault:false,status:'ready'},{id:3,label:'备用钱包',address:'0x3333333333333333333333333333333333333333',cash:0,isDefault:false,status:'ready'}]};
  P.esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  P.icon=(name,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.file}</svg>`;
  P.badge=(label,tone='good')=>`<span class="badge ${P.esc(tone)}"><i class="status-dot"></i>${P.esc(label)}</span>`;
  P.btn=(label,action,cls='secondary',attrs='')=>`<button type="button" class="btn ${P.esc(cls)}" data-action="${P.esc(action)}" ${attrs}>${label}</button>`;
  P.hero=(title,description,actions='',eyebrow='')=>`<section class="hero"><div>${eyebrow?`<div class="eyebrow">${P.esc(eyebrow)}</div>`:''}<h1>${P.esc(title)}</h1><p>${description}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</section>`;
  P.stat=(label,value,note='',tone='')=>`<article class="stat"><div class="stat-label">${P.esc(label)}</div><div class="stat-value ${P.esc(tone)}">${value}</div>${note?`<div class="stat-note">${note}</div>`:''}</article>`;
  P.notice=(text,tone='info')=>`<div class="notice ${P.esc(tone)}" role="note">${text}</div>`;
  P.empty=(title,description,action='')=>`<section class="empty"><div class="empty-icon">${P.icon('folder',24)}</div><h2>${P.esc(title)}</h2><p>${description}</p><div class="actions">${action}</div></section>`;
  P.table=(headers,rows,empty='暂无记录')=>`<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">${P.empty(empty,'试着调整筛选条件，或等待新记录。')}</td></tr>`}</tbody></table></div>`;
  P.field=(label,control,help='')=>`<label class="field"><span>${P.esc(label)}</span>${control}${help?`<small>${help}</small>`:''}</label>`;
  P.input=(name,value='',attrs='')=>`<input class="input" name="${P.esc(name)}" value="${P.esc(value)}" aria-label="${P.esc(name)}" ${attrs}>`;
  P.select=(name,items,selected='',attrs='')=>`<select class="input" name="${P.esc(name)}" aria-label="${P.esc(name)}" ${attrs}>${items.map(([v,label])=>`<option value="${P.esc(v)}" ${String(v)===String(selected)?'selected':''}>${P.esc(label)}</option>`).join('')}</select>`;
  P.tabs=(items,active,action)=>`<div class="tabs" role="tablist">${items.map(([key,label])=>`<button type="button" role="tab" aria-selected="${String(key===active)}" class="${key===active?'active':''}" data-action="${P.esc(action)}" data-value="${P.esc(key)}">${label}</button>`).join('')}</div>`;
  P.wallet=()=>P.wallets.find(w=>w.id===Number(P.state.walletId))||P.wallets[0];
  P.register=(key,meta,render)=>{P.routes[key]={...meta,render};};
  P.on=(name,handler)=>{P.handlers[name]=handler;};
  P.act=(name,el,event)=>P.handlers[name]?.(el||document.createElement('button'),event);
  P.form=selector=>Object.fromEntries(new FormData(document.querySelector(selector)));
  P.download=(filename,text,type='text/plain')=>{const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
  let focusBefore=null,toastTimer=null,confirmCallback=null;
  P.toast=text=>{const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},3200);};
  P.close=()=>{document.getElementById('overlay-root').innerHTML='';document.body.style.overflow='';confirmCallback=null;if(focusBefore?.isConnected)focusBefore.focus();focusBefore=null;};
  function overlay(kind,title,body,footer,options){focusBefore=document.activeElement;P.state.walletMenuOpen=false;document.getElementById('wallet-pop')?.setAttribute('hidden','');const root=document.getElementById('overlay-root');root.innerHTML=`<div class="overlay ${kind==='drawer'?'drawer-shade':''}" data-overlay-shade><section class="${kind} ${options.wide?'wide':''} ${P.esc(options.className||'')}" role="dialog" aria-modal="true" aria-labelledby="overlay-title"><header class="overlay-head"><div><h2 id="overlay-title">${P.esc(title)}</h2>${options.subtitle?`<p>${options.subtitle}</p>`:''}</div><button class="icon-btn" data-action="shell-close" aria-label="关闭">${P.icon('close')}</button></header><div class="overlay-body">${body}</div>${footer?`<footer class="overlay-footer">${footer}</footer>`:''}</section></div>`;document.body.style.overflow='hidden';setTimeout(()=>root.querySelector('button,input,select,a')?.focus(),0);}
  P.modal=(title,body,footer='',options={})=>overlay('modal',title,body,footer,options);
  P.drawer=(title,body,footer='',options={})=>overlay('drawer',title,body,footer,options);
  P.confirm=(title,body,callback,options={})=>{P.modal(title,body,P.btn('取消','shell-close')+P.btn(options.label||'确认','shell-confirm',options.danger?'danger':'primary'));confirmCallback=callback;};
  P.on('shell-close',()=>P.close());P.on('shell-confirm',()=>{const fn=confirmCallback;P.close();fn?.();});
  const nav=[['follow','跟单','/start'],['mine','我的','/'],['tracker','追踪','/tracker/wallets'],['activity','活动','/tracker/activity'],['smart','聪明钱包','/tracker/smart-wallets'],['wallets','钱包管理','/wallet-management'],['help','帮助','/help/follow-parameters']];
  const href=(key)=>`#${key}`;
  function navHtml(){return nav.map(([key,label])=>`<a href="${href(key)}" class="${(P.state.route===key||(key==='follow'&&P.state.route==='follow-detail')||(key==='tracker'&&P.state.route==='explore')||(key==='help'&&P.state.route==='help-home'))?'active':''}">${label}</a>`).join('')+(P.state.role==='admin'?`<a href="#admin" class="${P.state.route==='admin'?'active':''}">管理后台</a>`:'');}
  function header(){const unknown=P.state.scenario==='unknown';const total=P.state.walletUi?.hidden?'••••':unknown||P.wallets.some(w=>w.cash==null||w.status!=='ready')?'—':P.wallets.reduce((sum,w)=>sum+w.cash,0).toFixed(2);return `<header class="topbar"><button class="menu-button" data-action="shell-mobile-menu" aria-label="打开主导航">${P.icon('menu')}</button><a class="brand" href="#mine">PMPN</a><nav class="nav" aria-label="主导航">${navHtml()}</nav><div class="header-tools"><form id="header-lookup" class="lookup">${P.icon('search',13)}<input name="address" placeholder="搜索钱包地址" aria-label="搜索钱包地址"><button type="submit" class="sr-only">搜索</button></form>${P.state.loggedIn?`<button class="wallet-trigger" data-action="wallet-toggle-menu" aria-expanded="${Boolean(P.state.walletMenuOpen)}" aria-controls="wallet-pop" title="钱包总现金 pUSD">${P.icon('wallet',15)}<span class="cash-mark">$</span><strong>${total}</strong>${P.icon('chevron',12)}</button><button class="avatar round" data-action="shell-account" aria-label="账户菜单">P</button><aside class="wallet-pop" id="wallet-pop" aria-label="钱包操作菜单" ${P.state.walletMenuOpen?'':'hidden'}>${P.walletMenu?P.walletMenu():''}</aside>`:P.btn('登录','wallet-login','primary')}</div></header><nav class="mobile-nav" id="mobile-nav" aria-label="移动端主导航">${navHtml()}</nav>`;}
  P.render=()=>{const route=P.routes[P.state.route]||P.routes.follow;const all=Object.keys(P.routes);document.title=`${route.label} · PMPN 完整原型`;document.getElementById('device').innerHTML=header()+`<main class="content" id="content"><div class="print-info">PMPN 完整前端原型 · 示例数据 · ${P.esc(route.path||'')}</div>${scenarioHtml(route)}<footer class="page-footer"><span>示例数据 · 原型中的修改仅用于演示</span><div class="actions"><a href="#index">全部页面</a><a href="#notifications">通知</a><a href="#support">支持</a><a href="#privacy">隐私</a></div><span class="route-path">${P.esc(route.path||'原型总览')}</span></footer></main>`;document.getElementById('route-label').textContent=`${String(all.indexOf(P.state.route)+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}　${route.label}`;document.getElementById('scenario-select').value=P.state.scenario;document.getElementById('role-select').value=P.state.role;renderCatalog();};
  function scenarioHtml(route){const s=P.state.scenario;const publicKeys=['smart','help','help-home','privacy','markets','market-detail','leaderboard','settings','index'];if(s==='normal'||s==='unknown'||(s==='logged-out'&&publicKeys.includes(P.state.route)))return route.render();if(s==='loading')return P.hero(route.label,'正在获取最新数据…')+`<div class="grid stats">${[1,2,3,4].map(()=>'<div class="stat"><div class="skeleton" style="width:45%;margin:4px 0 22px"></div><div class="skeleton" style="height:25px;width:65%"></div></div>').join('')}</div><div class="panel">${[1,2,3,4,5].map(()=>'<div class="skeleton-row"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>').join('')}</div>`;if(s==='empty')return P.hero(route.label,route.description||'')+P.empty('暂时没有记录','你可以添加关注、创建任务或调整筛选条件，相关记录会显示在这里。',P.btn('返回示例内容','shell-normal','primary'));if(s==='error')return P.hero(route.label,route.description||'')+P.notice('读取失败，暂时无法获得最新数据。','bad')+P.empty('页面数据暂不可用','请检查连接后重试。',P.btn(P.icon('refresh',14)+' 重新读取','shell-normal','primary'));if(s==='logged-out')return P.hero(route.label,route.description||'')+P.empty('登录后使用此页面','登录后查看自己的跟单任务、钱包与私人关注。',P.btn('登录账户','wallet-login','primary'));return P.hero('页面无法访问','当前账户没有查看此页面的权限。')+P.empty('404 · 页面不存在','切换为管理员或回到你的跟单页面。',P.btn('返回跟单','shell-follow','primary'));}
  P.go=(key,params={})=>{if(key==='account')key='mine';if(!P.routes[key])return;P.close();P.state.walletMenuOpen=false;Object.assign(P.state,params,{route:key});if(location.hash!==`#${key}`)history.pushState(null,'',`#${key}`);document.getElementById('catalog-root').hidden=true;P.render();window.scrollTo(0,0);};

      <section class="card"><div class="section-head"><h2>当前执行摘要</h2><span class="muted small">新信号按此执行</span></div>${kv([['每次跟买', record.invalid ? '需要修复' : params.followBuys ? amount(params) : '已关闭', params.amountKind === 'fixed' ? '固定金额' : '按目标金额比例'], ['跟单方向', record.invalid ? '需要修复' : direction(params)], ['执行钱包', E(walletName(record.walletId)), record.walletId === 1 ? '默认执行钱包' : '当前任务的钱包'], ['执行方式', record.mode === 'paper' ? '模拟跟单' : '真实自动跟单', record.status === 'running' ? '仅处理之后的新交易' : '当前不产生新的跟单订单']])}</section></div>` +

  function draftValidation() {
    const d = P.core.draft;
    const p = d.params;
    const issues = [];
    if (!P.wallets.some(wallet => wallet.id === Number(d.walletId) && wallet.status === 'ready')) issues.push('选择可用的执行钱包');
    if (!d.alias.trim() || d.alias.trim().length > 20) issues.push('填写 1～20 个字符的备注名称');
    if (!d.editId && !d.verified) issues.push('核验目标钱包地址');
    if (!p.followBuys && !p.followSells) issues.push('至少开启跟买或跟卖');
    if (p.amount === '' || !Number.isFinite(Number(p.amount)) || Number(p.amount) < (p.amountKind === 'fixed' ? 1 : 0.000001)) issues.push(p.amountKind === 'fixed' ? '固定金额至少 $1' : '百分比必须大于 0');
    const required = [['buySlippage', 0, 99999], ['sellSlippage', 0, 99999], ['retries', 0, 100], ['maxSignalAge', 1, 3600], ['maxQueueAge', 1, 300], ['maxDeviation', 0, 100]];
    required.forEach(([key, min, max]) => { if (p[key] === '' || !Number.isFinite(Number(p[key])) || Number(p[key]) < min || Number(p[key]) > max) issues.push('请检查执行安全参数范围'); });
    [['buyOffset', -.999, .999], ['sellOffset', -.999, .999], ['targetPriceMin', .001, .999], ['targetPriceMax', .001, .999], ['startWindow', 1, 300], ['endWindow', 1, 300], ['maxHeldMarkets', 1, 999], ['perOrderMin', 1.2, 9999999], ['perOrderMax', 1.2, 9999999]].forEach(([key, min, max]) => {
      if (p[key] !== '' && (!Number.isFinite(Number(p[key])) || Number(p[key]) < min || Number(p[key]) > max)) issues.push('请检查可选参数范围');
    });
    ['buyDuration', 'sellDuration'].forEach(key => { if (p[key] !== '' && (!Number.isInteger(Number(p[key])) || Number(p[key]) < 1)) issues.push('限价单时长须为正整数'); });
    ['takeProfit', 'stopLoss'].forEach(key => {
      const value = String(p[key]).trim();
      if (value && !(/^(?:\d+(?:\.\d+)?)%$/.test(value) ? Number(value.slice(0, -1)) > 0 : Number(value) >= .001 && Number(value) <= .999)) issues.push('止盈止损应填写正百分比或 0.001～0.999 的价格');
    });
    const ranges = [['targetAmountMin', 'targetAmountMax', '目标交易金额'], ['targetPriceMin', 'targetPriceMax', '目标价格'], ['perOrderMin', 'perOrderMax', '单笔金额']];
    ranges.forEach(([min, max, label]) => { if (p[min] !== '' && p[max] !== '' && Number(p[min]) > Number(p[max])) issues.push(`${label}下限不能高于上限`); });
    if (p.speedMode === 'standard' && !p.marketTypes.length) issues.push('至少勾选一种市场类型');
    if (P.core.relationships.some(record => record.id !== d.editId && record.walletId === Number(d.walletId) && record.address.toLowerCase() === d.address.toLowerCase())) issues.push('此执行钱包已跟单该地址');
    return [...new Set(issues)];
  }

      <details class="core-advanced" ${d.openGroup === 'exits' ? 'open' : ''}><summary>止盈止损与自动卖出规则 <span class="muted">可选</span></summary><div class="form-grid">${p.sellMode === 'market' ? field('止盈目标', 'takeProfit', p.takeProfit, 'placeholder="如 20% 或 0.85"') + field('止损目标', 'stopLoss', p.stopLoss, 'placeholder="如 20% 或 0.30"') : P.notice('限价卖出启用期间 TP/SL 保留但不生效。', 'warn')}${numeric('余额止盈（USDC）', 'balanceTakeProfit')}${numeric('余额止损（USDC）', 'balanceStopLoss')}</div><p class="muted small">余额阈值只停止任务，不会平仓。持仓达到 5 份时预挂止盈限价单；不足 5 份触发止盈后按市价退出。止损按市价退出。</p></details>

  const helpGroups = [{"id":"basics","title":"运行模式与金额","description":"先决定怎样计算自己的买入金额。"},{"id":"buy-market","title":"市价买入","description":"使用当前卖盘买入，并限制可接受的价格变化。"},{"id":"buy-limit","title":"限价买入","description":"指定愿意支付的价格，等待成交。"},{"id":"execution","title":"自动执行安全","description":"只限制新的自动真实买入；卖出、止盈、止损和主动退出不受这些时效限制。"},{"id":"exits","title":"止盈、止损与余额","description":"份额价格决定何时退出持仓，钱包现金余额决定何时暂停任务。"},{"id":"filters","title":"目标交易与单笔金额","description":"先筛选对方的交易，再计算自己的买入金额。目标金额和价格过滤也适用于跟随卖出。"},{"id":"limits","title":"额度与持仓数量","description":"仅普通模式生效，只限制新增买入，不阻止卖出、止盈、止损和结算。"},{"id":"windows","title":"短周期时间窗口","description":"仅普通模式生效，按目标成交时间筛选 5 / 15 分钟市场的买入。"},{"id":"markets","title":"市场类型与关键词","description":"仅普通模式生效，只筛选买入。筛选条件需要同时满足。"},{"id":"selling","title":"复制方向与卖出","description":"选择跟随哪些动作，以及卖出时使用的订单方式。"}];
  const helpEntries = [{"id":"speedMode","group":"basics","label":"极速模式 / 普通模式","meaning":"普通模式使用完整规则；极速模式保留常用参数，跳过高级筛选与额度检查。","example":"设置只跟 BTC 后切换极速模式，币种筛选将不再生效，其他币种也可能买入。","input":"开关；关闭极速即为普通模式。","note":"极速模式跳过总花费、Yes/No 花费、单市场花费、最高持仓市场数、首尾窗口、市场类型和关键词限制；单笔上限和自动执行安全仍生效。"},{"id":"reverseFollow","group":"basics","label":"反向跟单","meaning":"设想中的反向复制功能，目前尚未开放。","example":"目标买入 Yes，系统不会因为这个开关而自动改买 No。","input":"暂不可设置，保持关闭。"},{"id":"copyAmount","group":"basics","label":"跟单金额：百分比 / 固定金额","meaning":"百分比以目标本次交易金额为基数；固定金额让每次买入使用同一个金额。","example":"目标买入 100 USDC，填 30% 得到 30 USDC；固定金额填 20，则计算为 20 USDC。","input":"百分比填数字，不填 %：0.000001～99,999；固定金额：1～9,999,999 USDC。","note":"这是计划买入金额，还需通过最小交易额、额度、余额和成交条件检查。跟随卖出的份数另按目标减仓比例计算。"},{"id":"orderMode","group":"basics","label":"买入订单类型","meaning":"市价单尝试立即与当前卖盘成交；限价单按你设置的价格挂单，可能需要等待。","example":"卖一是 0.50：市价买入尝试吃当前卖盘；限价挂在 0.48，需要出现愿意以这个价格成交的卖方。","input":"市价单 / 限价单，二选一。","note":"市价单也可能部分成交或无法成交；限价单遇到合适报价也可能立即成交。"},{"id":"buySlippagePercent","group":"buy-market","label":"市价买入滑点（%）","meaning":"以提交时卖一价为基准，设置愿意多付多少百分比。","example":"卖一 0.50、滑点 10%，理论买价上限为 0.55；最终按市场报价精度处理。","input":"0～99,999，填 10 表示 10%。","note":"基准是提交时的卖一价，不是目标成交价。数值越大，允许的价格越差；它不是额外手续费，也不保证成交。"},{"id":"failureRetries","group":"buy-market","label":"失败重试次数","meaning":"首次尝试失败后，最多再尝试多少次；能否重试仍取决于订单状态和安全检查。","example":"填 1，首次失败后最多再试 1 次；填 0，不追加重试。","input":"0～100 的整数。","note":"部分成交视为成功，不自动把未成交部分重复补买。"},{"id":"sportsDelayRetry","group":"buy-market","label":"体育市场延迟 10 秒后重试","meaning":"体育市场重试前多等 10 秒。","example":"首次订单确认零成交，且还有重试次数时，等待 10 秒再尝试。","input":"开关；用于体育市场重试。","note":"没有重试额度、已有成交或订单状态不明确时，不会仅因为打开此项就重下。过期的自动买入也不会重试。"},{"id":"buyLimitPriceReference","group":"buy-limit","label":"买入限价基准","meaning":"选择用哪一档盘口价格来计算买入限价。Bid 是买盘，Ask 是卖盘；L1 / L2 / L3 是第一、第二、第三档。中间价是买一与卖一的平均值。","example":"买三 0.46，选择 Bid L3，偏移 +0.02，计算出的限价为 0.48。","input":"买一 / 买二 / 买三 / 中间价 / 卖一 / 卖二 / 卖三。","note":"缺少所选档位、盘口为空或行情过期时不下单，不会自动替换档位。"},{"id":"buyLimitPriceOffset","group":"buy-limit","label":"买入价格偏移","meaning":"在所选基准价上直接加减一个价格数值。","example":"基准 0.50，填 0.02 得到 0.52；填 -0.02 得到 0.48。","input":"-0.999～0.999；0 表示使用基准价。","note":"0.02 是每份加 0.02，不是加 2%。最终价格还要满足市场价格范围和报价精度。"},{"id":"buyLimitDurationSeconds","group":"buy-limit","label":"买入限价单时长（秒）","meaning":"限价单最多等待多久；到期后处理尚未成交的部分。","example":"填 10，挂单约 10 秒后进入到期处理；若只成交一部分，已成交部分会保留。","input":"正整数秒；留空表示持续挂单。","note":"持续挂单仍可能因手动撤单、市场状态或其他执行条件结束。"},{"id":"buyLimitConvertToMarket","group":"buy-limit","label":"买入：到期时限价转市价","meaning":"到期后先撤限价单并核对实际成交，再尝试把未成交部分转为市价买入。","example":"计划 20 USDC，已成交 8 USDC，到期核对后只处理剩余部分。","input":"开关；需配合买入限价单时长。","note":"关闭时到期只撤未成交部分；时长留空则没有定时转换。转换仍需通过买入时效、价格与风险检查。"},{"id":"maxSignalAgeSeconds","group":"execution","label":"最大信号年龄（秒）","meaning":"从目标实际成交时间算起，超过这段时间就不再自动买入这条信号。","example":"填 30，目标 12:00:00 成交，这条自动买入信号到 12:00:30 过期。","input":"1～3,600 的整数秒。","note":"与最大排队时间同时检查，哪个截止时间先到就以哪个为准。"},{"id":"maxQueueAgeSeconds","group":"execution","label":"最大排队时间（秒）","meaning":"从为你创建跟单信号的时间算起，最多允许等待多久。","example":"填 15，信号 12:00:10 创建，排队截止为 12:00:25；即使最大信号年龄尚未到期，也不能继续等。","input":"1～300 的整数秒。","note":"过期买入不签名、不提交、不重试。它和目标成交时间不是同一个计时起点。"},{"id":"maxTargetPriceDeviationPercent","group":"execution","label":"目标价格最大不利偏差（%）","meaning":"限制当前待执行买价相对目标成交价贵了多少，避免追高。","example":"目标成交价 0.50，填 10%，0.55 恰好到边界仍可通过；0.56 超过边界会拒绝。","input":"0～100，填 10 表示 10%。","note":"比目标更便宜不属于不利偏差。它与市价滑点分别检查：一个对比目标成交价，一个对比提交时盘口。"},{"id":"takeProfit","group":"exits","label":"止盈目标（TP）","meaning":"为持仓设置希望获利退出的价格，可以按买入均价的涨幅，也可以直接填份额价格。","example":"均价 0.50，填 20% 对应 0.60；填 0.85 则直接以 0.85 为目标。","input":"带 %：0.1%～9,999%；不带 %：0.001～0.999；留空不设置。","note":"仅卖出方式为市价时生效。持仓达到 5 份会预挂止盈限价单，不足 5 份则在买一达到目标后尝试市价退出；不保证以目标价成交。"},{"id":"stopLoss","group":"exits","label":"止损目标（SL）","meaning":"为持仓设置下跌时退出的触发价，按当前可卖出价（买一）判断。","example":"均价 0.50，填 20% 对应 0.40；填 0.30 表示买一跌到 0.30 时触发。","input":"带 %：0.1%～9,999%；不带 %：0.001～0.999；留空不设置。","note":"仅卖出方式为市价时生效，触发后尝试市价退出。20% 是下跌幅度，不要填 -20%；触发价不等于最终成交价。百分比换算出的价格限制在 0.001～0.999。"},{"id":"balanceTakeProfit","group":"exits","label":"余额止盈（USDC）","meaning":"检查执行钱包现金余额，达到或高于设定值时暂停当前任务，不会因此平仓。","example":"填 200，检查时现金余额为 205 USDC，就暂停任务；不是要求盈利 200 USDC。","input":"0～9,999,999 USDC；留空不设置。","note":"检查是周期性的，并非逐笔实时触发。现金余额不包含未卖出持仓的估值，入金也会改变余额。"},{"id":"balanceStopLoss","group":"exits","label":"余额止损（USDC）","meaning":"检查执行钱包现金余额，低于或等于设定值时暂停当前任务，不会因此平仓。","example":"填 50，买入后现金从 70 变成 45 USDC，下一次检查可能暂停任务，即使持仓没有亏损。","input":"0～9,999,999 USDC；留空不设置。","note":"这不是净资产止损，也不是允许亏损金额；现金会随买入、卖出、入金和提现变化。"},{"id":"targetAmountMin","group":"filters","label":"忽略交易金额 <（目标金额下限）","meaning":"目标原始交易金额低于这个数就不跟。","example":"填 50：目标交易 40 USDC 会被忽略，交易 50 USDC 可以通过这项检查。","input":"0～9,999,999 USDC；留空不限制。","note":"目标交易金额 = 目标成交份数 × 成交价，不是自己的买入金额。下限不能大于上限。"},{"id":"targetAmountMax","group":"filters","label":"忽略交易金额 >（目标金额上限）","meaning":"目标原始交易金额高于这个数就不跟。","example":"填 500：目标交易 600 USDC 会被忽略，500 USDC 可以通过。","input":"0～9,999,999 USDC；留空不限制。","note":"即使你的固定金额只有 5 USDC，目标交易超过此上限也会被过滤。"},{"id":"targetPriceMin","group":"filters","label":"最低份额价格","meaning":"只接受目标成交价不低于这个价格的交易。","example":"填 0.20，目标以 0.18 成交会被过滤，以 0.20 成交可通过。","input":"0.001～0.999；留空不限制。","note":"填写每份价格，不是 USDC 总金额；下限不能大于上限。"},{"id":"targetPriceMax","group":"filters","label":"最高份额价格","meaning":"只接受目标成交价不高于这个价格的交易。","example":"填 0.80，目标以 0.85 成交会被过滤；这是检查目标价格，不是给自己的挂单定价。","input":"0.001～0.999；留空不限制。"},{"id":"buyAtMinimum","group":"filters","label":"低于最小限额时按最低买入","meaning":"计算出的金额不足最低交易额时，允许提高到最低交易额。","example":"目标买 10 USDC，你跟 5% 得到 0.50 USDC。市价买入时开启此项会提高到 1 USDC；关闭则跳过。","input":"开关。","note":"市价买入最低 1 USDC；限价最低金额还要按限价和盘口最低份数计算。提高金额仍不能突破其他上限或余额。"},{"id":"perOrderMin","group":"filters","label":"单笔最少","meaning":"使用百分比跟单时，将偏小的计算金额提高到这个数。","example":"按比例算出 3 USDC，单笔最少填 5，金额调整为 5 USDC。","input":"1.2～9,999,999 USDC；留空不设置。","note":"固定金额模式不使用此项抬高金额。下限不能大于单笔最多；平台最低交易额仍单独检查。"},{"id":"perOrderMax","group":"filters","label":"单笔最多","meaning":"百分比模式将偏大的金额压到此上限；固定金额或最低买入金额超过上限时，拒绝买入。","example":"按比例算出 30 USDC，上限 20，调整为 20；固定金额 30、上限 20，则跳过这笔买入。","input":"1.2～9,999,999 USDC；留空不限制。","note":"极速模式也会检查此项。"},{"id":"totalSpendLimit","group":"limits","label":"总花费限额","meaning":"买入前，比较执行钱包现有跟单持仓成本、当前任务待成交买单剩余金额和本次计划金额的总和。","example":"持仓成本 60、当前任务待买 20、本次买 30，总计 110；限额 100 时整笔拒绝，不会只买剩余的 20。","input":"0～9,999,999 USDC；留空不限制。","note":"不是历史累计成交额，也不是每日预算；已持仓部分按成本而非当前市值计算。同一执行钱包其他任务的现有跟单持仓也会计入。"},{"id":"outcomeSpendLimit","group":"limits","label":"Yes/No 最大花费","meaning":"限制同一执行钱包在某个市场的同一个结果方向上占用多少金额，包含持仓成本和待成交买单。","example":"某市场 Yes 已占 15 USDC，再买 10，总计 25；Yes/No 上限 20 时拒绝。No 是另一个方向，单独计算。","input":"1～9,999,999 USDC；留空不限制。"},{"id":"marketSpendLimit","group":"limits","label":"单市场最大花费","meaning":"把同一执行钱包在一个市场各方向的持仓成本和待成交买单合起来限制。","example":"同一市场 Yes 占 20、No 占 15，再买 10，总计 45；单市场上限 40 时拒绝。","input":"1～9,999,999 USDC；留空不限制。","note":"Yes/No 限额和单市场限额同时设置时，两项都需要通过。"},{"id":"maxHeldMarkets","group":"limits","label":"最高持仓市场数","meaning":"限制同一执行钱包同时涉及多少个市场；持仓和待成交买单涉及的市场都会计数。","example":"上限 3，已有 3 个市场时不能买第 4 个；继续买已有市场仍要满足金额等其他限制。","input":"1～999 的整数；留空不限制。","note":"同一个市场同时持有 Yes 和 No，只算一个市场。"},{"id":"shortMarketStartWindowSeconds","group":"windows","label":"开盘后前 N 秒","meaning":"允许跟随发生在开盘后一段时间内的目标买入。","example":"12:00 开盘，填 30，允许 12:00:00～12:00:30 内发生的目标交易。","input":"1～300 的整数秒；留空不设置此窗口。","note":"这是允许交易的窗口，不是开盘后先等 N 秒。"},{"id":"shortMarketEndWindowSeconds","group":"windows","label":"收盘前最后 N 秒","meaning":"允许跟随发生在收盘前一段时间内的目标买入。","example":"12:05 收盘，填 30，允许 12:04:30～12:05:00。若也设置开盘后 30 秒，则头尾两段都允许，中间不允许。","input":"1～300 的整数秒；两个窗口都留空表示不限制。","note":"同时设置两个窗口，满足任意一个即可。只有识别出开收盘时间的 5 / 15 分钟市场才应用此项。"},{"id":"marketTypes","group":"markets","label":"市场类型","meaning":"选择允许买入的市场分类：加密货币、体育、政治、天气或其他。","example":"只勾 Crypto，就只允许识别为加密货币的市场；一个类型都不选，会阻止所有跟单买入。","input":"可多选；“全部”表示不限市场类型。","note":"选择“全部”时，不再按 Crypto 周期和币种筛选。"},{"id":"cryptoDurations","group":"markets","label":"Crypto 周期","meaning":"在选择 Crypto 时进一步限定市场持续时间。","example":"只选 5min，会排除识别为 15min 的加密市场。","input":"5min / 15min / 1h / 4h，可多选；不选表示不限。","note":"仅对 Crypto 生效，且市场类型不能是“全部”。无法识别所选周期的市场不能通过此筛选。"},{"id":"cryptoSymbols","group":"markets","label":"Crypto 币种","meaning":"在选择 Crypto 时进一步限定市场对应的币种。","example":"只选 BTC，就排除识别为 ETH 的加密市场；再选 5min，需要同时满足 BTC 和 5 分钟。","input":"BTC / ETH / SOL / XRP，可多选；不选表示不限。","note":"仅对 Crypto 生效，且市场类型不能是“全部”。"},{"id":"excludeKeywords","group":"markets","label":"屏蔽关键词（逗号分隔）","meaning":"市场名称或链接名称包含任意一个屏蔽词，就不买入；匹配不区分大小写。","example":"填 Trump, election，名称包含其中任意一个词就会被屏蔽。","input":"中文或英文逗号分隔；留空不屏蔽。每词最多 100 字符，最多 100 个词。","note":"屏蔽优先于“只买关键词”；是文字包含匹配，不是智能语义匹配。"},{"id":"includeKeywords","group":"markets","label":"只买关键词（逗号分隔）","meaning":"填了关键词后，市场名称或链接名称至少包含一个词才可以买入。","example":"填 BTC, Bitcoin，包含任意一个即可通过这项检查，不要求两个同时出现。","input":"中文或英文逗号分隔；留空不限制。每词最多 100 字符，最多 100 个词。","note":"匹配不区分大小写；仍需通过屏蔽词、市场类型、金额等其他检查。"},{"id":"followBuys","group":"selling","label":"跟单买入","meaning":"是否复制目标的新买入动作。","example":"关闭后，目标新增买入不会触发你的跟单买入；开启后也要通过其他过滤规则。","input":"开关；买入和卖出至少开启一个。","note":"创建任务只处理新的交易，不会立即复制目标全部历史持仓。"},{"id":"followSells","group":"selling","label":"跟单卖出","meaning":"是否复制目标的卖出动作。自动真实卖出按目标减仓比例，计算你已有持仓中需要卖出的份数。","example":"目标原有 100 份，卖出 25 份（25%）；你有 20 份，则计划卖出 5 份。","input":"开关；买入和卖出至少开启一个。","note":"没有可卖持仓或无法可靠计算目标减仓比例时不自动卖出。关闭此项不会关闭独立的止盈 / 止损。"},{"id":"sellMode","group":"selling","label":"卖出：市价单 / 限价单","meaning":"市价卖出尝试与当前买盘成交；限价卖出按照基准价和偏移挂单。","example":"买一 0.60，市价卖出尝试立即成交；限价挂在 0.65，可能需要等到出现合适买家。","input":"跟单卖出开启后可选择。","note":"选择限价卖出期间，止盈 / 止损参数保留但不生效；余额阈值仍可暂停任务。"},{"id":"sellSlippagePercent","group":"selling","label":"卖出滑点（%）","meaning":"以提交时买一价为基准，设置卖出可接受的降价幅度。","example":"买一 0.50、滑点 10%，理论保护价为 0.45；实际提交还按市场报价精度处理。","input":"0～99,999；填 10 表示 10%。用于市价卖出。","note":"数值越大，允许更低的成交价格；这是价格容忍度，不是保证成交的承诺。"},{"id":"sellLimitPriceReference","group":"selling","label":"卖出限价基准","meaning":"选择计算卖出限价的盘口档位。Bid 是买盘，Ask 是卖盘；中间价为买一与卖一的平均值。","example":"选择 Ask L1（卖一），卖一 0.60、偏移 -0.01，得到限价 0.59。","input":"买一 / 买二 / 买三 / 中间价 / 卖一 / 卖二 / 卖三。","note":"缺少所选档位、盘口为空或行情过期时不下单。"},{"id":"sellLimitPriceOffset","group":"selling","label":"卖出价格偏移","meaning":"在卖出基准价上直接加减每份价格。","example":"基准 0.60，填 -0.01 得到 0.59；填 0.02 得到 0.62。","input":"-0.999～0.999；0 表示不偏移。","note":"这是价格差，不是百分比；最终仍需满足市场价格范围与报价精度。"},{"id":"sellLimitDurationSeconds","group":"selling","label":"卖出限价单时长（秒）","meaning":"设置卖出限价单等待多久后处理未成交部分。","example":"填 60，挂单约 60 秒后到期；留空则不设置定时到期。","input":"正整数秒；留空表示持续挂单。"},{"id":"sellLimitConvertToMarket","group":"selling","label":"卖出：到期时限价转市价","meaning":"到期先撤单核对，再尝试市价卖出剩余份数。","example":"计划卖 20 份，已成交 8 份，核对后仅处理剩余的 12 份。","input":"开关；需配合卖出限价单时长。","note":"关闭时到期只撤未成交部分；时长留空则没有定时转换。实际卖出还取决于最新持仓和盘口。"}];
  const H=P.state.helpPrototype=P.state.helpPrototype||{query:'',group:'all',kind:'percentage',target:'100',amount:'30',maximum:'20'};
  function amountResult() {
    const target=Number(H.target),amount=Number(H.amount),maximum=H.maximum.trim()===''?null:Number(H.maximum);
    const valid=H.target.trim()!==''&&H.amount.trim()!==''&&Number.isFinite(target)&&target>0&&target<=9999999&&Number.isFinite(amount)&&amount>=(H.kind==='fixed'?1:0.000001)&&amount<=(H.kind==='fixed'?9999999:99999)&&(maximum===null||(Number.isFinite(maximum)&&maximum>=1.2&&maximum<=9999999));
    if(!valid)return P.notice('请输入有效数字：目标金额须大于 0；固定金额至少 1，比例至少 0.000001；单笔最多至少 1.2 或留空。','bad');
    const base=H.kind==='fixed'?amount:target*amount/100,skip=H.kind==='fixed'&&maximum!==null&&base>maximum,result=skip?null:Math.max(1,maximum!==null?Math.min(base,maximum):base);
    return `<div class="grid two"><div><p class="muted small">按金额方式计算</p><strong>${H.kind==='fixed'?'固定 '+fmt(amount,''):fmt(target,'')+' × '+fmt(amount,'')+'%'} = ${fmt(base,'')} USDC</strong><p class="small muted">${skip?'固定金额超过单笔上限，本次买入跳过。':base<1?'开启最低买入：计划金额提高至 1 USDC。':maximum!==null&&base>maximum?'百分比计算金额被单笔上限压低。':'通过演示中的单笔金额检查。'}</p></div><div class="card"><span class="muted small">本例计划买入</span><div style="font-size:32px;font-weight:700" class="${skip?'amber':'positive'}">${skip?'跳过':fmt(result,'')+' USDC'}</div></div></div>`;
  }
  function amountDemo() {
    return `<section class="card" id="help-amount-demo"><div class="section-head"><div><span class="muted small">动手试一笔</span><h2>对方买了，我会买多少？</h2></div>${P.badge('仅演示','neutral')}</div>${P.tabs([['percentage','按百分比'],['fixed','按固定金额']],H.kind,'help-kind')}<form id="help-amount-form" class="grid three">${P.field('目标交易金额（USDC）',input('target',H.target,'type="number" step="any" min="0" data-change="help-calculate"'))}${P.field(H.kind==='fixed'?'我的固定金额（USDC）':'我的跟单比例（%）',input('amount',H.amount,'type="number" step="any" min="0" data-change="help-calculate"'))}${P.field('单笔最多（USDC，可留空）',input('maximum',H.maximum,'type="number" step="any" min="1.2" placeholder="不限制" data-change="help-calculate"'))}</form><div class="divider"></div>${amountResult()}<p class="muted small">按市价买入、开启最低买入演示；其他条件假设通过。真实执行仍检查过滤、余额、额度、时效和盘口。本页不改配置、不提交订单。</p></section>`;
  }
  function renderHelp() {
    const terms=H.query.toLowerCase().trim().split(/\s+/).filter(Boolean),entries=helpEntries.filter(e=>(H.group==='all'||e.group===H.group)&&terms.every(t=>[e.label,e.meaning,e.example,e.input,e.note].join(' ').toLowerCase().includes(t)));
    return moduleStyle+P.hero('每个参数，都讲明白。','找到配置页上的同名参数，先看它管什么，再用具体例子理解。',B('去配置跟单 →','help-go-follow','primary'),'跟单使用手册')+
      `<div class="grid three"><div class="card"><strong>金额看 USDC</strong><p class="small muted">本页 $ 均指 USDC 金额，价格 0.50 表示每份 0.50。</p></div><div class="card"><strong>例子用来理解规则</strong><p class="small muted">示例不是收益预测，不修改配置或提交订单。</p></div><div class="card"><strong>留空不等于填 0</strong><p class="small muted">选填项留空通常表示不限制，按各参数说明填写。</p></div></div>`+
      amountDemo()+`<div class="split tracker-split"><aside class="card filters"><h3>帮助目录</h3><button class="btn ghost" data-action="help-group" data-value="all">全部 ${helpEntries.length} 项参数</button>${helpGroups.map(g=>`<button class="btn ${H.group===g.id?'primary':'ghost'}" data-action="help-group" data-value="${g.id}">${E(g.title)}</button>`).join('')}<div class="divider"></div>${B('钱包与安全说明','help-home','secondary')}${B('客服与问题反馈','help-support','ghost')}</aside><section class="stack"><div class="card toolbar">${input('help-query',H.query,'type="search" placeholder="搜索参数，例如：滑点、单笔最多、止损" data-change="help-query" aria-label="搜索参数名称说明或例子"')}${B('清空','help-clear','ghost')}</div><p class="small muted" role="status">${H.query||H.group!=='all'?'找到 '+entries.length+' 项匹配参数':'全部 '+helpEntries.length+' 项参数 · 名称与配置页对应'}</p>${entries.length?helpGroups.map(g=>{const group=entries.filter(e=>e.group===g.id);if(!group.length)return '';return `<section class="card"><h2>${E(g.title)}</h2><p class="small muted">${E(g.description)}</p>${group.map(e=>`<article class="panel tracker-parameter" id="help-${e.id}"><h3>${E(e.label)}</h3><p>${E(e.meaning)}</p><div class="notice info"><strong>举个例子</strong><p>${E(e.example)}</p></div><p class="small"><strong>怎么填：</strong>${E(e.input)}</p>${e.note?`<p class="small muted"><strong>留意：</strong>${E(e.note)}</p>`:''}</article>`).join('')}</section>`;}).join(''):P.empty('没有找到这个参数','试试配置页上的原名称，或搜索“金额”“限价”“卖出”。',B('查看全部参数','help-clear','primary'))}<section class="card"><h2>容易弄混的问题</h2><details><summary>参数都填好了，为什么没有跟单？</summary><p>一次执行需要同时通过生效条件。信号过期、余额不足、缺少盘口、任务暂停或目标过滤都可能阻止执行。${B('查看我的信号','help-signals','ghost small')}</p></details><details><summary>止损填 20 和填 20% 有什么区别？</summary><p>20% 表示相对买入均价下跌 20%。不带 % 会当成份额价格，价格只接受 0.001～0.999，因此填 20 无效。</p></details><details><summary>额度不够会自动买剩余金额吗？</summary><p>单笔最多会压低百分比模式金额；总花费、单市场和 Yes/No 限额超出时拒绝整笔买入。</p></details><details><summary>关闭跟单卖出，止盈止损还运行吗？</summary><p>独立止盈 / 止损仍可生效；但卖出方式为限价时，它们保留而暂停生效。</p></details></section></section></div>`;
  }
  function renderHelpHome() {
